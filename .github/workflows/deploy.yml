# 푸시하면 등록된 모든 클라우드플레어 계정에 워커를 자동 배포한다.
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   CF_API_TOKEN         — 클라우드플레어 API 토큰 ("Edit Cloudflare Workers" 템플릿,
#                          Account Resources에 배포할 계정들 포함)
#   CF_ACCOUNT_ID_S2ANGH — s2angh 계정의 Account ID
#   CF_ACCOUNT_ID_MLPO   — mlpo9881 계정의 Account ID
#
# 계정을 추가하려면: 시크릿에 CF_ACCOUNT_ID_XXX를 등록하고 아래 matrix에 한 줄 추가.
# (토큰의 Account Resources에 그 계정도 포함돼 있어야 한다)
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 한 계정 배포가 실패해도 나머지 계정 배포는 계속한다
      matrix:
        include:
          - account_name: s2angh
            account_id_secret: CF_ACCOUNT_ID_S2ANGH
          - account_name: mlpo9881
            account_id_secret: CF_ACCOUNT_ID_MLPO
    name: deploy (${{ matrix.account_name }})
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets[matrix.account_id_secret] }}
      # 업데이트 서버용 설치 키를 워커 시크릿으로 자동 동기화 (s2angh 계정만 —
      # 업데이트 서버는 그 워커 하나다). 키 변경 = 저장소 시크릿 UPDATE_KEYS 수정
      # 후 재배포. CF 대시보드를 손으로 만질 일이 없다.
      - name: Sync update keys
        if: matrix.account_name == 's2angh'
        run: printf '%s' "${{ secrets.UPDATE_KEYS }}" | npx wrangler@4 secret put UPDATE_KEYS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets[matrix.account_id_secret] }}
